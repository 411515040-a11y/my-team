<!-- Handoff: Created standalone BMI calculator HTML with embedded CSS and JS; validated edge cases and metric inputs; ready to use directly in any browser. -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator / BMI 計算小工具</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --error-bg: #fef2f2;
      --error-text: #b91c1c;
      --underweight: #3b82f6;
      --normal: #10b981;
      --overweight: #f59e0b;
      --obese: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 48px 10px 12px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .unit {
      position: absolute;
      right: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-calc {
      background: var(--primary);
      color: #fff;
    }

    .btn-calc:hover {
      background: var(--primary-hover);
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
      flex: 0.45;
    }

    .btn-reset:hover {
      background: #cbd5e1;
    }

    .alert {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .result-box {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      text-align: center;
    }

    .bmi-value-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .bmi-number {
      font-size: 2.4rem;
      font-weight: 800;
      margin: 4px 0;
      line-height: 1.1;
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      margin-top: 4px;
    }

    .badge.underweight { background-color: var(--underweight); }
    .badge.normal { background-color: var(--normal); }
    .badge.overweight { background-color: var(--overweight); }
    .badge.obese { background-color: var(--obese); }

    .scale-guide {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      font-size: 0.7rem;
      text-align: center;
      color: var(--text-muted);
    }

    .scale-item {
      padding: 4px 2px;
      border-radius: 4px;
      background: #f1f5f9;
      line-height: 1.3;
    }

    .scale-item strong {
      display: block;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>BMI Calculator</h1>
      <p class="subtitle">BMI 計算小工具</p>
    </header>

    <form id="bmiForm" onsubmit="return false;">
      <div class="form-group">
        <label for="height">Height / 身高</label>
        <div class="input-wrapper">
          <input type="number" id="height" placeholder="e.g. 170" step="any" min="0" autofocus>
          <span class="unit">cm</span>
        </div>
      </div>

      <div class="form-group">
        <label for="weight">Weight / 體重</label>
        <div class="input-wrapper">
          <input type="number" id="weight" placeholder="e.g. 65" step="any" min="0">
          <span class="unit">kg</span>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-reset" id="resetBtn">Reset</button>
        <button type="submit" class="btn-calc" id="calcBtn">Calculate / 計算</button>
      </div>
    </form>

    <div id="errorBox" class="alert" role="alert"></div>

    <div id="resultBox" class="result-box" aria-live="polite">
      <div class="bmi-value-label">Your BMI / 你的 BMI</div>
      <div class="bmi-number" id="bmiDisplay">--</div>
      <div id="categoryBadge" class="badge">--</div>
    </div>

    <div class="scale-guide">
      <div class="scale-item">
        <strong>&lt; 18.5</strong>
        過輕
      </div>
      <div class="scale-item">
        <strong>18.5–23.9</strong>
        正常
      </div>
      <div class="scale-item">
        <strong>24.0–26.9</strong>
        過重
      </div>
      <div class="scale-item">
        <strong>&ge; 27.0</strong>
        肥胖
      </div>
    </div>
  </div>

  <script>
    const heightInput = document.getElementById('height');
    const weightInput = document.getElementById('weight');
    const calcBtn = document.getElementById('calcBtn');
    const resetBtn = document.getElementById('resetBtn');
    const errorBox = document.getElementById('errorBox');
    const resultBox = document.getElementById('resultBox');
    const bmiDisplay = document.getElementById('bmiDisplay');
    const categoryBadge = document.getElementById('categoryBadge');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      resultBox.style.display = 'none';
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.style.display = 'none';
    }

    function calculateBMI() {
      clearError();

      const rawHeight = heightInput.value.trim();
      const rawWeight = weightInput.value.trim();

      if (!rawHeight || !rawWeight) {
        showError('Please enter both height and weight. / 請輸入身高與體重。');
        return;
      }

      const height = parseFloat(rawHeight);
      const weight = parseFloat(rawWeight);

      if (isNaN(height) || isNaN(weight)) {
        showError('Please enter valid numeric values. / 請輸入有效數字。');
        return;
      }

      if (height <= 0 || weight <= 0) {
        showError('Height and weight must be greater than 0. / 身高與體重數值必須大於 0。');
        return;
      }

      if (height < 30 || height > 300) {
        showError('Please enter a realistic height (30 - 300 cm). / 請輸入合理的身高數值 (30 - 300 cm)。');
        return;
      }

      if (weight < 2 || weight > 500) {
        showError('Please enter a realistic weight (2 - 500 kg). / 請輸入合理的體重數值 (2 - 500 kg)。');
        return;
      }

      const heightInMeters = height / 100;
      const bmi = weight / (heightInMeters * heightInMeters);
      const bmiFormatted = bmi.toFixed(1);
      const roundedBmi = parseFloat(bmiFormatted);

      let categoryText = '';
      let badgeClass = '';

      if (roundedBmi < 18.5) {
        categoryText = 'Underweight / 過輕';
        badgeClass = 'underweight';
      } else if (roundedBmi <= 23.9) {
        categoryText = 'Normal / 正常';
        badgeClass = 'normal';
      } else if (roundedBmi <= 26.9) {
        categoryText = 'Overweight / 過重';
        badgeClass = 'overweight';
      } else {
        categoryText = 'Obese / 肥胖';
        badgeClass = 'obese';
      }

      bmiDisplay.textContent = bmiFormatted;
      categoryBadge.textContent = categoryText;
      categoryBadge.className = 'badge ' + badgeClass;

      resultBox.style.display = 'block';
    }

    function resetForm() {
      heightInput.value = '';
      weightInput.value = '';
      clearError();
      resultBox.style.display = 'none';
      heightInput.focus();
    }

    calcBtn.addEventListener('click', calculateBMI);
    resetBtn.addEventListener('click', resetForm);

    [heightInput, weightInput].forEach(input => {
      input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          calculateBMI();
        }
      });
    });
  </script>
</body>
</html>
